# RagMind · API 服务的 K8s 部署
# vLLM 推理服务单独部署（见 README 里 vllm 说明），api 通过 LLM_BASE_URL 指向它。

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragmind-api
  labels: {app: ragmind-api}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: ragmind-api}
  template:
    metadata:
      labels: {app: ragmind-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: api
          image: ragmind/app:0.1.0
          command: ["uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000",
                    "--workers", "1", "--loop", "uvloop"]
          ports: [{name: http, containerPort: 8000}]
          env:
            - name: PG_DSN
              valueFrom: {secretKeyRef: {name: ragmind-secrets, key: pg-dsn}}
            - name: REDIS_URL
              valueFrom: {secretKeyRef: {name: ragmind-secrets, key: redis-url}}
            - name: LLM_PROVIDER
              value: "vllm"
            - name: LLM_BASE_URL
              value: "http://vllm:8000/v1"
            - name: RERANK_ENABLED
              value: "true"
          resources:
            requests: {cpu: "500m", memory: "512Mi"}
            limits: {cpu: "2", memory: "1Gi"}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              exec: {command: ["sh", "-c", "sleep 5"]}
---
apiVersion: v1
kind: Service
metadata:
  name: ragmind-api
spec:
  selector: {app: ragmind-api}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ragmind-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ragmind-api}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleUp: {stabilizationWindowSeconds: 30}
    scaleDown: {stabilizationWindowSeconds: 300}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ragmind-api
spec:
  minAvailable: 1
  selector: {matchLabels: {app: ragmind-api}}
